spring.application.name=contoh-daftar-buku
# Port dibaca dari variabel PORT bila ada; di komputer lokal tetap 8080
server.port=${PORT:8080}

# Database H2 in-memory (hilang saat aplikasi dimatikan)
spring.datasource.url=jdbc:h2:mem:perpustakaan
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Tabel dibuat otomatis dari @Entity, lalu data.sql dijalankan
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
